<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web 串口助手 - 921600</title>
<style>
:root { --bg:#0d1117; --card:#161b22; --border:#30363d; --text:#c9d1d9;
  --muted:#8b949e; --accent:#58a6ff; --green:#3fb950; --red:#f85149;
  --radius:8px; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,"Segoe UI","Noto Sans SC",sans-serif;
  background:var(--bg); color:var(--text); line-height:1.6; padding:16px;
  max-width:700px; margin:0 auto; }
h1 { font-size:18px; color:var(--accent); margin-bottom:8px; }
.controls { background:var(--card); border:1px solid var(--border);
  border-radius:var(--radius); padding:12px 14px; margin-bottom:12px;
  display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
.controls label { font-size:13px; color:var(--muted); margin-right:4px; }
select, button { background:#1f2937; color:var(--text); border:1px solid var(--border);
  border-radius:6px; padding:8px 12px; font-size:14px; cursor:pointer; }
select { min-width:100px; }
button:hover { background:#273548; }
#disconnectBtn { display:none; }
#connectBtn.connected { background:var(--green); color:#000; display:none; }
#disconnectBtn.connected { display:inline; background:var(--red); }
#status { font-size:12px; color:var(--muted); margin-left:auto; }
#output { background:var(--bg); border:1px solid var(--border);
  border-radius:var(--radius); height:420px; overflow-y:auto;
  padding:12px 14px; font-family:"Consolas","Courier New",monospace;
  font-size:12px; line-height:1.55; white-space:pre-wrap; word-break:break-all;
  -webkit-overflow-scrolling:touch; }
#output .spell { color:var(--accent); font-weight:bold; }
.toolbar { display:flex; gap:6px; margin-bottom:8px; }
.toolbar button { font-size:12px; padding:4px 10px; }
#counter { font-size:12px; color:var(--muted); margin-left:8px; }
</style>
</head>
<body>
<h1>⚡ Web 串口助手</h1>
<p style="color:var(--muted);font-size:12px;margin-bottom:12px;">
  仅 Chrome/Edge 115+ 支持 | 波特率 921600 | 按按钮挥动魔杖查看识别结果
</p>

<div class="controls">
  <button id="connectBtn" onclick="connect()">🔌 连接串口</button>
  <button id="disconnectBtn" onclick="disconnect()">⏹ 断开</button>
  <label>波特率</label>
  <select id="baudRate">
    <option value="921600" selected>921600</option>
    <option value="115200">115200</option>
    <option value="9600">9600</option>
  </select>
  <span id="status">未连接</span>
</div>

<div class="toolbar">
  <button onclick="document.getElementById('output').innerHTML=''">🗑 清屏</button>
  <button onclick="document.getElementById('baudRate').value='921600'">921600</button>
  <span id="counter">已收: 0 字节</span>
</div>

<pre id="output"></pre>

<script>
let port = null, reader = null, writer = null;
let byteCount = 0;

document.getElementById('connectBtn').onclick = connect;
document.getElementById('disconnectBtn').onclick = disconnect;

async function connect() {
  try {
    port = await navigator.serial.requestPort();
    const baud = parseInt(document.getElementById('baudRate').value);
    await port.open({ baudRate: baud, dataBits: 8, parity: 'none', stopBits: 1 });
    document.getElementById('connectBtn').classList.add('connected');
    document.getElementById('disconnectBtn').classList.add('connected');
    document.getElementById('status').textContent = `已连接 @ ${baud} bps`;
    reader = port.readable.getReader();
    readLoop();
  } catch (e) {
    if (e.message !== 'Failed to execute \'requestPort\' on \'Serial\': No port selected by the user.') {
      document.getElementById('output').innerHTML += `\n连接失败: ${e.message}`;
    }
  }
}

async function disconnect() {
  try {
    if (reader) { await reader.cancel(); reader.releaseLock(); reader = null; }
    if (port) { await port.close(); port = null; }
  } catch(e) {}
  document.getElementById('connectBtn').classList.remove('connected');
  document.getElementById('disconnectBtn').classList.remove('connected');
  document.getElementById('status').textContent = '已断开';
}

async function readLoop() {
  const decoder = new TextDecoder();
  const out = document.getElementById('output');
  let lineBuf = '';
  try {
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      if (!value) continue;
      byteCount += value.length;
      document.getElementById('counter').textContent = `已收: ${byteCount} 字节`;
      let text = decoder.decode(value, {stream: true});
      lineBuf += text;
      let lines = lineBuf.split('\n');
      lineBuf = lines.pop(); // 不完整行保留
      for (const line of lines) {
        let cls = '';
        if (/RightAngle|SharpAngle|Lightning|Triangle|Letter_h|letter_R|letter_W|letter_phi|Circle|UpAndDown|Horn|Wave|NoMotion/.test(line)) {
          cls = 'spell';
        }
        out.innerHTML += `<span class="${cls}">${escapeHtml(line)}</span>\n`;
      }
      out.scrollTop = out.scrollHeight;
    }
  } catch(e) {
    if (e.message !== 'The device was disconnected.' && e.name !== 'AbortError') {
      document.getElementById('status').textContent = `读取错误: ${e.message}`;
    }
    disconnect();
  }
}

function escapeHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
</body>
</html>
